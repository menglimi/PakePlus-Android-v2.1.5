
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="明惠Pro" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/609/609803.png" />
    <title>明惠地产营销系统 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: 'var(--brand-50)', 100: 'var(--brand-100)', 500: 'var(--brand-500)', 
                600: 'var(--brand-600)', 700: 'var(--brand-700)', 900: 'var(--brand-900)',
              },
              bg: {
                 main: 'var(--bg-main)',
                 sidebar: 'var(--bg-sidebar)',
                 card: 'var(--bg-card)',
              }
            },
            fontFamily: {
              sans: ['"Microsoft YaHei"', '"PingFang SC"', '"Heiti SC"', '"Segoe UI"', 'sans-serif'],
              serif: ['"SimSun"', '"Songti SC"', 'serif'],
            }
          }
        }
      }
    </script>
    <style>
      :root {
         --brand-50: #eff6ff; --brand-100: #dbeafe; --brand-500: #3b82f6;
         --brand-600: #2563eb; --brand-700: #1d4ed8; --brand-900: #1e3a8a;
         --bg-main: #f1f5f9; --bg-sidebar: #1e293b; --bg-card: #ffffff;
         --text-main: #334155;
         --text-muted: #64748b;
         --border-color: #cbd5e1;
      }

      body.theme-green {
         --brand-50: #f0fdf4; --brand-100: #dcfce7; --brand-500: #22c55e;
         --brand-600: #16a34a; --brand-700: #15803d; --brand-900: #14532d;
         --bg-main: #f8fafc; --bg-sidebar: #064e3b; --bg-card: #ffffff;
      }

      body.theme-classic {
         --brand-50: #fffbeb; --brand-100: #fef3c7; --brand-500: #d97706;
         --brand-600: #b45309; --brand-700: #92400e; --brand-900: #78350f;
         --bg-main: #fffdf5; --bg-sidebar: #451a03; --bg-card: #ffffff;
      }

      body.theme-tech {
         --brand-50: #0f172a; --brand-100: #1e293b; --brand-500: #06b6d4;
         --brand-600: #0891b2; --brand-700: #0e7490; --brand-900: #155e75;
         --bg-main: #000000; --bg-sidebar: #050505; --bg-card: #0a0a0a;
         --text-main: #e0f2fe;
         --text-muted: #7dd3fc;
         --border-color: #1e293b;
      }
      
      body { 
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif; 
        background-color: var(--bg-main); 
        color: var(--text-main); 
        transition: background-color 0.3s, color 0.3s;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
      }
      
      #root { height: 100%; width: 100%; }

      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      
      @media print {
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        body { background: white; color: black; height: auto; overflow: visible; }
      }

      .loading-spin { animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      .fade-in { animation: fadeIn 0.4s ease-out; }
      
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.1/client",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "xlsx": "https://cdn.sheetjs.com/xlsx-0.20.0/package/xlsx.mjs",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.2",
    "vite": "https://aistudiocdn.com/vite@^7.2.7",
    "fuse.js": "https://aistudiocdn.com/fuse.js@^7.0.0",
    "idb": "https://aistudiocdn.com/idb@^8.0.0",
    "react-window": "https://esm.sh/react-window@1.8.10",
    "react-virtualized-auto-sizer": "https://esm.sh/react-virtualized-auto-sizer@^1.0.26",
    "zod": "https://esm.sh/zod@^4.2.1",
    "pinyin-pro": "https://esm.sh/pinyin-pro@^3.19.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
